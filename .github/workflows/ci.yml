name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build + test (${{ matrix.compiler }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
          - compiler: clang
            cc: clang
            cxx: clang++
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
      - name: Build (library, tests, examples, benchmarks)
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure

  sanitizers:
    name: sanitizer (${{ matrix.sanitizer }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, undefined]
    env:
      CC: clang
      CXX: clang++
      ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v4
      # Newer kernels randomize mmap with more bits than older sanitizer runtimes expect.
      - name: Lower mmap randomization for sanitizers
        run: sudo sysctl vm.mmap_rnd_bits=28
      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
          -DTINYNET_SANITIZER=${{ matrix.sanitizer }}
          -DTINYNET_BUILD_EXAMPLES=OFF -DTINYNET_BUILD_BENCHMARKS=OFF
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure

  coverage:
    name: coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install gcovr
        run: pipx install gcovr
      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
          -DTINYNET_BUILD_EXAMPLES=OFF -DTINYNET_BUILD_BENCHMARKS=OFF
          -DCMAKE_CXX_FLAGS="--coverage -O0 -fprofile-update=atomic" -DCMAKE_EXE_LINKER_FLAGS="--coverage"
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Coverage report
        run: |
          mkdir -p coverage
          GCOVR="gcovr -r . build --filter src/ --filter include/ --exclude-throw-branches --exclude-unreachable-branches"
          $GCOVR --html-details coverage/index.html --txt coverage/summary.txt --txt-metric branch
          {
            echo "## Branch coverage (library only)"
            echo '```'
            cat coverage/summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat coverage/summary.txt
      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

  fuzz:
    name: fuzz (buffer, 60s)
    runs-on: ubuntu-24.04
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4
      - name: Install libFuzzer runtime
        run: dpkg -s libclang-rt-18-dev >/dev/null 2>&1 || (sudo apt-get update -q && sudo apt-get install -y -q libclang-rt-18-dev)
      - name: Lower mmap randomization for sanitizers
        run: sudo sysctl vm.mmap_rnd_bits=28
      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="-O1 -g"
          -DTINYNET_BUILD_FUZZERS=ON -DTINYNET_SANITIZER="address,undefined"
          -DTINYNET_BUILD_TESTS=OFF -DTINYNET_BUILD_EXAMPLES=OFF -DTINYNET_BUILD_BENCHMARKS=OFF
      - name: Build
        run: cmake --build build -j --target buffer_fuzzer
      - name: Fuzz for 60 seconds
        run: |
          mkdir -p fuzz-out/corpus
          cp fuzz/corpus/buffer/* fuzz-out/corpus/
          ./build/fuzz/buffer_fuzzer -max_total_time=60 -print_final_stats=1 \
            -artifact_prefix=fuzz-out/ fuzz-out/corpus 2>&1 | tee fuzz-out/fuzz.log
          {
            echo "## Buffer fuzzer (60 s)"
            echo '```'
            grep -E '^stat::|DONE' fuzz-out/fuzz.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload crash reproducers
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: fuzz-out/crash-*
